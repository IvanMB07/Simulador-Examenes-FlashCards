<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestor Accesible de Playlists</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">
        <!-- Header Principal -->
        <header>
            <div>
                <h1>Gestor de Biblioteca Musical</h1>
                <p>Crea, asigna y exporta tus listas de reproducción al instante</p>
            </div>
            <div class="header-actions">
                <button type="button" id="btnExportarTodo" class="btn btn-secondary">⬇ Exportar CSV Completo</button>
            </div>
        </header>

        <div class="main-layout">
            <!-- Sidebar: Playlists Accesibles -->
            <aside>
                <!-- Carga de Archivo -->
                <section class="card">
                    <div class="card-title">1. Cargar Archivo</div>
                    <div class="file-upload-wrapper" id="dropZone">
                        <label for="csvFileInput" class="file-upload-btn" id="uploadLabel">
                            📂 Arrastrar o seleccionar CSV
                        </label>
                        <input type="file" id="csvFileInput" accept=".csv">
                    </div>
                </section>

                <!-- Creador de Playlist Integrado -->
                <section class="card">
                    <div class="card-title">2. Crear Playlist</div>
                    <div class="quick-create-box">
                        <input type="text" id="playlistNameInput" placeholder="Nombre de la nueva lista...">
                        <button type="button" id="btnCrearPlaylist" class="btn btn-primary">+ Crear</button>
                    </div>
                </section>

                <!-- Listas Disponibles con Exportación Directa -->
                <section class="card flex-grow">
                    <div class="card-title">Playlists Guardadas</div>
                    <ul class="playlist-list" id="playlistList">
                        <!-- Se puebla por JS -->
                    </ul>
                </section>
            </aside>

            <!-- Área Principal: Asignación y Rápido Filtro -->
            <main class="card">
                <!-- Barra de Acción Rápida -->
                <div class="table-toolbar">
                    <div class="search-box">
                        <input type="text" id="searchInput" placeholder="🔍 Buscar canción o artista...">
                    </div>

                    <!-- Asignación Directa -->
                    <div class="assign-box">
                        <select id="assignPlaylistSelect">
                            <option value="">-- Mover seleccionadas a... --</option>
                        </select>
                        <button class="btn btn-primary" id="btnAsignar">Mover</button>
                    </div>
                </div>

                <!-- Tabla de Datos -->
                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th class="checkbox-col"><input type="checkbox" id="selectAll"></th>
                                <th>#</th>
                                <th>Título de la Pista</th>
                                <th>Playlist</th>
                                <th>Acción</th>
                            </tr>
                        </thead>
                        <tbody id="tracksTableBody">
                            <tr>
                                <td colspan="5" class="empty-msg">No hay datos cargados. Selecciona o arrastra un
                                    archivo CSV.</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </main>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
